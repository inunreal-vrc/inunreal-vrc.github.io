name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Ensure LFS assets are materialized
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull
          git lfs checkout

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail

          if [[ ! -d assets ]]; then
            echo "❌ Missing /assets directory in repository root"
            exit 1
          fi

          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            if git lfs pointer --check --file="$file" >/dev/null 2>&1; then
              echo "❌ LFS pointer detected in deploy payload: $file"
              exit 1
            fi
          done < <(git lfs ls-files -n | grep '^assets/' || true)

          mkdir -p _site/assets
          cp -R assets/. _site/assets/
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
