name: Validate static assets and Git LFS

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-assets-lfs:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure git-lfs is available
        run: |
          git lfs install --local

      - name: Validate static assets location and LFS tracking
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t lfs_extensions < <(
            awk '/^\*\.[^ ]+ filter=lfs/ { sub(/^\*\./, "", $1); print tolower($1) }' .gitattributes
          )

          if [[ "${#lfs_extensions[@]}" -eq 0 ]]; then
            echo "❌ No LFS extension rules found in .gitattributes"
            exit 1
          fi

          failed=0

          while IFS= read -r -d '' file; do
            lower_file="${file,,}"
            file_ext="${lower_file##*.}"
            is_static_asset=0

            for ext in "${lfs_extensions[@]}"; do
              if [[ "$file_ext" == "$ext" ]]; then
                is_static_asset=1
                break
              fi
            done

            if [[ "$is_static_asset" -eq 0 ]]; then
              continue
            fi

            if [[ ! "$file" =~ ^assets/ ]]; then
              echo "❌ Static asset must be under /assets: $file"
              failed=1
            fi

            if ! git check-attr filter -- "$file" | grep -q 'filter: lfs'; then
              echo "❌ Static asset is not tracked by Git LFS: $file"
              failed=1
            fi
          done < <(git ls-files -z)

          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi

          echo "✅ Static assets are in /assets and tracked by Git LFS"
